<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Kathirselvam V - SAP FICO Tests</title>
<style>
:root{--bg:#f3f5fb;--c:#fff;--t:#16203a;--m:#62708f;--p:#4f46e5;--p2:#06b6d4;--ok:#0f9d63;--bad:#d93f3f;--b:#e2e7f3;--sh:0 6px 20px rgba(40,50,110,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#0c1020;--c:#151b33;--t:#eaeefc;--m:#9aa6c8;--p:#8b87ff;--p2:#3dd6e8;--ok:#4cd39a;--bad:#ff8080;--b:#273056;--sh:0 6px 20px rgba(0,0,0,.35)}}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 "Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--t)}
header.top{background:linear-gradient(120deg,#4f46e5,#06b6d4);color:#fff;padding:12px 18px;position:sticky;top:0;z-index:5;box-shadow:var(--sh)}
header.top a{color:#fff;text-decoration:none;font-weight:700;letter-spacing:.3px}
main{max-width:780px;margin:0 auto;padding:22px 16px 40px}
h1{font-size:2.1rem;margin:.1em 0}h2{margin:.4em 0 .6em}.sub{color:var(--m)}
.hero{background:linear-gradient(135deg,#4f46e5 0%,#7c3aed 55%,#06b6d4 120%);color:#fff;border-radius:18px;padding:28px 22px;box-shadow:var(--sh)}
.hero p{margin:.2em 0;opacity:.92}.hero h1{margin:0 0 4px}.hero .tag{display:inline-block;background:rgba(255,255,255,.2);padding:3px 12px;border-radius:99px;font-size:.85rem;margin-bottom:10px}
.hero .ct{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hero .ct a{background:rgba(255,255,255,.18);color:#fff;text-decoration:none;padding:8px 14px;border-radius:10px;font-size:.95rem}
.hero .ct a:hover{background:rgba(255,255,255,.3)}
.grid{display:grid;gap:14px;margin-top:18px}
.card{background:var(--c);border:1px solid var(--b);border-radius:14px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
a.card{display:flex;gap:14px;align-items:center;color:inherit;text-decoration:none;border-left:5px solid var(--p);transition:.15s}
a.card:nth-child(2){border-left-color:var(--p2)}a.card:nth-child(3){border-left-color:#f59e0b}
a.card:hover{transform:translateY(-2px)}a.card .ic{font-size:1.9rem}
a.card b{font-size:1.1rem;display:block}a.card span.s{display:block;color:var(--m);font-size:.92rem}
input,textarea{width:100%;padding:11px;border:1.5px solid var(--b);border-radius:10px;background:var(--bg);color:var(--t);font:inherit;margin:4px 0 12px}
input:focus,textarea:focus{outline:none;border-color:var(--p)}
button{background:linear-gradient(120deg,var(--p),#7c3aed);color:#fff;border:0;border-radius:10px;padding:12px 26px;font:inherit;font-weight:600;cursor:pointer;box-shadow:var(--sh)}
button:disabled{opacity:.6}
label.o{display:block;padding:10px 12px;border:1.5px solid var(--b);border-radius:10px;margin:7px 0;cursor:pointer}
label.o:hover{border-color:var(--p)}
.ok{border-color:var(--ok)!important;color:var(--ok);background:rgba(15,157,99,.1)}.bad{border-color:var(--bad)!important;color:var(--bad)}label.o.bad{background:rgba(217,63,63,.1)}
.score{display:inline-block;font-size:1.6rem;font-weight:700;background:linear-gradient(120deg,var(--p),var(--p2));-webkit-background-clip:text;background-clip:text;color:transparent}
.res{border:2px solid var(--p);border-radius:14px;padding:14px;margin-top:14px;background:var(--c)}
nav a{color:var(--p);text-decoration:none;font-weight:600}
footer{text-align:center;color:var(--m);font-size:.88rem;padding:0 16px 30px}footer a{color:var(--p)}
details summary{cursor:pointer}pre{white-space:pre-wrap;margin:6px 0;font:inherit}
</style></head><body><header class="top"><a href="#">&#127891; Kathirselvam V &middot; SAP FICO</a></header><main id="app"></main><footer>Kathirselvam V &middot; <a href="tel:9344472138">9344472138</a> &middot; <a href="mailto:kathirselvamv82@gmail.com">kathirselvamv82@gmail.com</a></footer>
<script>
// ====== SETTINGS ======
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwRlUkL6etYacGOX_PQq59njFzIY1qHlpH8_d7uMEIrKGzUCFGfOMLfLpo4xera4eEH/exec";   // paste your Google Apps Script Web App URL here
const OWNER = "Kathirselvam V";
// ====== QUESTIONS ======
const P=s=>s.trim().split("\n").map(l=>{const a=l.split("|");return[a[0],a.slice(1,5),"ABCD".indexOf(a[5])]});
const L=s=>s.trim().split("\n");
const M1=P(`
What is the main purpose of ERP in an organization?|To manage different business activities in an integrated system|To manage only the finance department|To replace all employees|To manage only customer complaints|A
Which statement best explains the relationship between ERP and SAP?|ERP and SAP are exactly the same thing|ERP is a business management concept, while SAP is software used to manage business activities|SAP is a hardware device used by ERP|ERP is only used for accounting while SAP is only used for HR|B
A company wants to record sales, purchases, customer amounts, vendor amounts, and bank transactions. Which area of SAP FICO is mainly responsible?|CO|PP|FI|MM|C
A production manager wants to analyze production costs and profitability internally. Which area is mainly relevant?|FI|SD|HCM|CO|D
What is the key difference between FI and CO?|FI focuses on financial transactions, while CO focuses on internal cost and profitability analysis|FI is only for employees, while CO is only for customers|FI manages materials, while CO manages sales|FI and CO perform exactly the same function|A
Why is a Company Code important in SAP FI?|It is used only for employee management|It is the smallest organizational unit where complete financial accounting can be maintained|It is used only for consolidated reporting|It is used only to control customer credit|B
A group has ABC India, ABC USA, and ABC Germany, each maintaining its own accounting records. What would normally represent each individual legal/accounting entity?|Company|Client|Company Code|Business Area|C
What is the main purpose of a Company in the enterprise structure?|Daily G/L posting|Employee tolerance control|Opening and closing posting periods|Corporate/group-level and consolidated financial reporting|D
A company has one Company Code but wants to analyze Mobile Phones, Laptops, and Home Appliances separately. Which organizational unit can help with this internal reporting?|Business Area|Company|Client|Credit Control Area|A
Why is a Credit Control Area used?|To create G/L accounts|To manage and monitor customer credit limits|To define fiscal year periods|To control field status|B
A customer has a credit limit of ₹10,00,000 and total credit exposure becomes ₹11,00,000. What is the main concern?|The fiscal year automatically changes|The Company Code is deleted|The credit exposure exceeds the approved credit limit|The G/L account becomes inactive|C
Why is a Fiscal Year used?|To define employee salaries|To define customer credit limits|To define G/L account numbers|To define the accounting period used to record and manage financial transactions|D
For an April-to-March fiscal year, which month is Period 1?|January|March|April|December|C
Why are special periods used in SAP?|For missing, correction, adjustment, tax, and auditing-related entries|To create new Company Codes|To create customer accounts|To replace normal posting periods|A
What does Year Shift represent?|The difference between FI and CO|The difference between the Fiscal Year and Calendar Year|The difference between Company and Company Code|The difference between debit and credit|B
What is the main purpose of a Fiscal Year Variant?|To define customer credit limits|To create G/L accounts|To assign users to tolerance groups|To define the structure of the fiscal year, posting periods, special periods, and year shifts|D
Why does SAP control Posting Periods?|To automatically create Company Codes|To calculate employee salaries|To control when financial transactions are allowed to be posted|To create Business Areas|C
July is a completed accounting month, and the company wants to prevent users from making normal postings into July. What should happen to July?|July should be deleted|July should be closed for posting|July should become a special Company Code|July should be converted into a Business Area|B
Why is it important to close a completed posting period?|To help avoid wrong entries, support month-end activities, and make auditing easier|To delete all previous transactions|To increase the credit limit|To create new G/L accounts|A
If August is open and July is closed, what can normally happen?|Transactions can only be posted in July|Transactions can be posted in both months without control|Transactions cannot be posted in any month|Transactions can normally be posted in August but not in July|D
What is the purpose of an Employee Tolerance Group?|To define Company Codes|To control financial transaction limits for SAP users or employees|To maintain fiscal years|To create Business Areas|B
An employee is allowed a maximum document amount of ₹1,00,000. What happens if the employee attempts to process ₹1,50,000?|The transaction automatically becomes a special period|The Company Code changes|The transaction exceeds the permitted limit|The amount is automatically reduced to ₹1,00,000|C
Which of the following can be controlled using an Employee Tolerance Group?|Maximum amount per document, open item, discount, and payment difference|Only the user's password|Only the Company Code|Only the fiscal year|A
What is the purpose of Field Status?|To determine customer credit limits|To determine the fiscal year|To determine document number ranges|To determine how a field behaves during data entry|D
A field is marked as “Required.” What does this mean?|The field is hidden|The user must enter a value|The field cannot be changed|The field is automatically deleted|B
Why is a Chart of Accounts maintained?|To control employee posting limits|To control customer credit limits|To organize G/L accounts used to record financial transactions category-wise|To open and close posting periods|C
A company has Cash, Bank, Machinery, Loan, Salary, and Sales accounts. Why would these accounts be organized into Account Groups?|To organize similar G/L accounts into categories|To close the fiscal year|To control customer credit|To assign users to SAP|A
What is the main purpose of a Controlling Area?|To maintain customer master data|To create document numbers|To define the fiscal year|To manage and analyze internal costs|D
In a G/L posting, a Rent Expense account is debited and a Liability account is credited. Why is the Liability account credited?|Because the company received cash immediately|Because the company has a payable amount related to the expense|Because the expense account represents a customer|Because the bank account was increased|B
In the G/L payment process, what happens when the outstanding liability is paid?|The liability is increased using the Bank account|The fiscal year is changed|The liability is settled using the Bank/Asset account|The Business Area is deleted|C
`);
const M2=P(`
Which T-code is used to define a Customer Account Group?|OBD2|XDN1|OBAR|BUCF|A
Which T-code is used to maintain Customer Number Ranges?|OBAR|XDN1|OBD2|BUC2|B
Which T-code is used to assign a Customer Number Range to an Account Group?|XDN1|OBD2|OBAR|BUCF|C
What does BP Grouping determine?|Customer payment terms|Vendor reconciliation account|Posting period|Business Partner classification and number assignment|D
Which T-code is used to maintain Business Partner Number Ranges?|BUCF|BUC2|OBD2|OBA3|A
What is the purpose of BUC2?|To create customer invoices|To assign a number range to a Business Partner grouping|To post vendor payments|To display customer line items|B
What is the purpose of V_TBD001?|To configure cheque numbers|To configure vendor payment methods|To link Customer Account Groups with Business Partner Groupings|To create internal orders|C
Which T-code is used to configure Customer Tolerance Groups?|OBD2|OBAR|OBB8|OBA3|D
Which transaction is used to create customers as Business Partners in SAP S/4HANA?|BP|FD02|F-22|FBL5N|A
Which T-code is used to post a Customer Invoice?|F-28|F-22|F-29|F-39|B
Which T-code is used to display Customer Line Items?|F-22|F-28|FBL5N|FBL1N|C
Which T-code is used to post an Incoming Payment from a customer?|F-22|F-29|F-39|F-28|D
Which T-code is used to post a Customer Down Payment?|F-29|F-28|F-39|F-22|A
Which T-code is used to clear a Customer Down Payment?|F-28|F-39|F-29|FBL5N|B
Which T-code is used to define a Vendor Account Group?|XKN1|OBAS|OBD3|OBA3|C
Which T-code is used to maintain Vendor Number Ranges?|OBD3|OBAS|BUCF|XKN1|D
Which T-code is used to assign a number range to a Vendor Account Group?|OBAS|XKN1|OBD3|OBB8|A
What does the Business Partner role FLVN00 represent?|Customer sales area|Supplier Financial Accounting|Customer financial accounting|Supplier purchasing organization|B
Which T-code is used to post a Vendor Invoice?|F-53|FBL1N|F-43|F-48|C
Which T-code is used to display Vendor Line Items?|F-43|F-53|F-48|FBL1N|D
Which T-code is used to post an Outgoing Payment to a vendor?|F-53|F-43|F-48|F-54|A
What is the purpose of OBXU in the vendor process?|To create a vendor account group|To configure automatic posting for vendor cash discounts taken|To display vendor line items|To create a vendor down payment|B
Which T-code is used to post a Vendor Down Payment?|F-53|F-54|F-48|F-43|C
Which T-code is used to clear a Vendor Down Payment?|F-48|F-53|FBL1N|F-54|D
Which T-code is used to configure the Automatic Payment Program?|FBZP|FCHI|F-28|OBA3|A
What is the purpose of Paying Company Codes in FBZP?|To create customer accounts|To identify the company codes responsible for making payments|To define vendor number ranges|To create cost centers|B
What is a House Bank in SAP?|A customer bank account|A vendor's personal bank account|A company's bank maintained in SAP|A temporary clearing account|C
Which T-code is used to maintain cheque number ranges?|F-02|FCH5|FCHN|FCHI|D
Which T-code is used to create a Cost Center?|KS01|KS02|KS03|KO01|A
Which T-code is used to create an Internal Order?|KS01|KO01|KOT2|KONK|B
`);
const D1=L(`
What is ERP?
What is SAP?
What is SAP FICO?
What is Financial Accounting (FI)?
What is Controlling (CO)?
What is a Company Code?
What is a Company in SAP?
What is a Credit Control Area?
What is a Business Area?
What is a Fiscal Year?
What is a Fiscal Year Variant?
What is a Posting Period?
What is a Posting Period Variant?
What is a Tolerance Group?
What is Field Status?
What is a Chart of Accounts?
What is an Account Group?
What is a Controlling Area?
What is a Ledger?
What is a General Ledger (G/L)?
`);
const D2=L(`
What is Customer Master Data?
What is a Customer Account Group?
What is a Customer Number Range?
What is Business Partner (BP) in SAP S/4HANA?
What is a Customer Tolerance Group?
What is a Customer Invoice?
What is Customer Line Item Display?
What is an Incoming Payment?
What is a Customer Down Payment?
What is Vendor Master Data?
What is a Vendor Account Group?
What is a Vendor Number Range?
What is the FLVN00 Business Partner Role?
What is a Vendor Invoice?
What is Vendor Line Item Display?
What is an Outgoing Payment?
What is a Vendor Down Payment?
What is the Automatic Payment Program (APP)?
What are Paying Company Codes in FBZP?
What is a Payment Method in SAP?
What is a House Bank?
What is Bank Determination in FBZP?
What is a Cheque Lot?
What is Check Information in SAP?
What is a Cost Center?
What is a Cost Center Category?
What is an Internal Order?
What is the purpose of creating an Internal Order?
What is the difference between a Cost Center and an Internal Order?
What is the purpose of KO01 in SAP FICO?
`);
const T={first:{n:"First Half Test",mcq:M1,def:D1},second:{n:"Second Half Test",mcq:M2,def:D2},full:{n:"Full Test",mcq:[...M1,...M2],def:[...D1,...D2]}};
// ====== HELPERS ======
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function send(p){
  if(!SCRIPT_URL){const a=JSON.parse(localStorage.rs||"[]");a.push(p);localStorage.rs=JSON.stringify(a);return true}
  try{const r=await fetch(SCRIPT_URL,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)});return (await r.json()).ok}catch(e){return false}
}
// ====== PAGES ======
function home(){
  const ic={first:"&#128215;",second:"&#128217;",full:"&#127942;"};
  app.innerHTML=`<div class="hero"><span class="tag">SAP FICO Practice Tests</span><h1>${OWNER}</h1><p>Trainer &middot; SAP FICO</p>
  <div class="ct"><a href="tel:9344472138">&#128222; 9344472138</a><a href="mailto:kathirselvamv82@gmail.com">&#9993; kathirselvamv82@gmail.com</a></div></div>
  <h2 style="margin-top:26px">Choose your test</h2><div class="grid">
  ${Object.entries(T).map(([k,v])=>`<a class="card" href="#t/${k}"><span class="ic">${ic[k]}</span><div><b>${v.n}</b><span class="s">${v.mcq.length} MCQs &middot; ${v.def.length} definition questions</span></div></a>`).join("")}</div>
  <p class="sub" style="margin-top:28px;text-align:center"><a href="#admin" style="color:inherit">Teacher login</a></p>`;
}
function pick(k){
  const t=T[k];
  app.innerHTML=`<nav><a href="#">&larr; Home</a></nav><h2>${t.n}</h2><div class="grid">
  <a class="card" href="#t/${k}/mcq"><span class="ic">&#9989;</span><div><b>MCQ Test</b><span class="s">${t.mcq.length} questions &middot; instant result</span></div></a>
  <a class="card" href="#t/${k}/def"><span class="ic">&#9997;</span><div><b>Definition Test</b><span class="s">${t.def.length} written answers &middot; reviewed by teacher</span></div></a></div>`;
}
let cleanup=null;
function quiz(k,type){
  const t=T[k],qs=t[type],isM=type==="mcq";
  app.innerHTML=`<nav><a href="#t/${k}">&larr; Back</a></nav><h2>${t.n}: ${isM?"MCQ":"Definition"} Test</h2>
  <div class="card" id="intro"><label>Name<input id="nm"></label><label>Email<input id="em" type="email"></label><label>Phone number<input id="ph" type="tel"></label>
  <p class="sub"><b>Rules:</b> the test opens in full screen. Do not switch tabs or apps, minimise the window or leave full screen. Each time you do, you get a warning. After 3 warnings your test is submitted automatically. Copy, paste and right-click are blocked.</p>
  <button id="start">Start Test</button><p id="msg0" class="bad"></p></div>
  <div id="run" style="display:none"><div class="card" id="bar" style="position:sticky;top:52px;z-index:4;padding:10px 16px;margin-bottom:14px"><b>Warnings: <span id="wc">0</span> / 3</b></div>
  <div id="qs">${qs.map((q,i)=>isM?`<div class="card" id="q${i}"><b>${i+1}. ${esc(q[0])}</b>${q[1].map((o,j)=>`<label class="o"><input type="radio" name="q${i}" value="${j}" style="width:auto;margin:0 8px 0 0">${esc(o)}</label>`).join("")}</div>`
   :`<div class="card"><b>${i+1}. ${esc(q)}</b><textarea rows="4" name="q${i}"></textarea></div>`).join("")}</div>
  <button id="sub">Submit</button></div><p id="msg"></p>`;
  let warns=0,active=false,done=false,last=0,fsOk=false,md=null,info={};
  const block=e=>{if(active)e.preventDefault()};
  const leave=e=>{if(active){e.preventDefault();e.returnValue=""}};
  const onVis=()=>{if(document.hidden)warn("You switched tab or app.")};
  const onBlur=()=>warn("You left the test window.");
  const onFs=()=>{if(fsOk&&!document.fullscreenElement)warn("You exited full screen.")};
  function fs(){if(fsOk&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}
  function stop(){active=false;["copy","cut","paste","contextmenu"].forEach(n=>document.removeEventListener(n,block));
    document.removeEventListener("visibilitychange",onVis);removeEventListener("blur",onBlur);document.removeEventListener("fullscreenchange",onFs);removeEventListener("beforeunload",leave);
    if(md)md.remove();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
  cleanup=stop;
  function warn(why){
    if(!active||done||Date.now()-last<1500)return;last=Date.now();warns++;document.getElementById('wc').textContent=warns;
    if(warns>=3){finish(true);return}
    if(md)md.remove();md=document.createElement("div");
    md.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:99;padding:20px";
    md.innerHTML=`<div class="card" style="max-width:380px;text-align:center"><h2 class="bad">&#9888; Warning ${warns} / 3</h2><p>${why}<br>After 3 warnings your test will be submitted automatically.</p><button>OK, continue</button></div>`;
    md.querySelector("button").onclick=()=>{md.remove();md=null;fs()};document.body.appendChild(md);
  }
  document.getElementById('start').onclick=async()=>{
    const name=nm.value.trim(),email=em.value.trim(),phone=ph.value.trim();
    if(!name||!/^\S+@\S+\.\S+$/.test(email)||phone.length<7){msg0.textContent="Please enter your name, a valid email and phone number.";return}
    info={name,email,phone};
    try{await document.documentElement.requestFullscreen();fsOk=true}catch(e){fsOk=false}
    document.getElementById('intro').style.display="none";document.getElementById('run').style.display="block";scrollTo(0,0);
    active=true;last=Date.now()+1500;
    ["copy","cut","paste","contextmenu"].forEach(n=>document.addEventListener(n,block));
    document.addEventListener("visibilitychange",onVis);addEventListener("blur",onBlur);document.addEventListener("fullscreenchange",onFs);addEventListener("beforeunload",leave);
  };
  document.getElementById('sub').onclick=()=>{if(confirm("Submit your test now?"))finish(false)};
  async function finish(auto){
    if(done)return;done=true;stop();
    let score=0,answers=[];
    qs.forEach((q,i)=>{
      if(isM){const c=document.querySelector(`input[name=q${i}]:checked`),a=c?+c.value:-1;if(a===q[2])score++;
        answers.push({q:q[0],a:a<0?"(no answer)":q[1][a],correct:q[1][q[2]]});
        document.querySelectorAll(`input[name=q${i}]`).forEach(r=>{const l=r.parentElement;r.disabled=true;if(+r.value===q[2])l.classList.add("ok");else if(+r.value===a)l.classList.add("bad")})}
      else answers.push({q,a:document.querySelector(`textarea[name=q${i}]`).value.trim()})});
    const sub=document.getElementById('sub');sub.remove();document.getElementById('bar').remove();
    const msg=document.getElementById('msg');msg.textContent="Submitting...";
    const tag=(isM?"MCQ":"Definition")+(warns?` (warnings: ${warns}${auto?", auto-submitted":""})`:"");
    const ok=await send({time:new Date().toISOString(),test:t.n,type:tag,...info,score:isM?score:"",total:isM?qs.length:"",answers});
    msg.className=isM?"res":"";
    msg.innerHTML=(auto?`<b class="bad">Your test was submitted automatically after 3 warnings.</b><br>`:"")+(isM?`<span class="score">Your score: ${score} / ${qs.length}</span><br>Green = correct answer, red = your wrong answer.`:"Your answers have been submitted. Your teacher will review them.")+(ok?"":`<br><span class="bad">Warning: could not save to the server. Tell your teacher.</span>`);
    document.getElementById('qs').scrollIntoView();
  }
}
async function admin(){
  const pw=prompt("Teacher password");if(pw===null){location.hash="";return}
  app.innerHTML="<p>Loading...</p>";let rows=[];
  try{
    if(SCRIPT_URL){const r=await (await fetch(SCRIPT_URL+"?pw="+encodeURIComponent(pw))).json();if(r.error)throw 0;rows=r.rows}
    else rows=JSON.parse(localStorage.rs||"[]");
  }catch(e){app.innerHTML=`<p class="bad">Wrong password or server error.</p><a href="#">Home</a>`;return}
  rows.reverse();
  app.innerHTML=`<nav><a href="#">&larr; Home</a></nav><h2>Student responses (${rows.length})</h2>
  ${rows.map(r=>{const a=typeof r.answers==="string"?JSON.parse(r.answers):r.answers;return `<details class="card"><summary><b>${esc(r.name)}</b> &middot; ${esc(r.test)} (${esc(r.type)}) ${r.total?`&middot; ${esc(r.score)}/${esc(r.total)}`:""}<br><small class="sub">${esc(r.email)} &middot; ${esc(r.phone)} &middot; ${new Date(r.time).toLocaleString()}</small></summary>
  ${a.map((x,i)=>`<pre><b>${i+1}. ${esc(x.q)}</b>\n${esc(x.a||"(blank)")}${x.correct!==undefined?`\n<span class="${x.a===x.correct?"ok":"bad"}">Correct: ${esc(x.correct)}</span>`:""}</pre>`).join("")}</details>`}).join("")||"<p>No responses yet.</p>"}`;
}
function route(){if(cleanup){cleanup();cleanup=null}const p=location.hash.slice(1).split("/");
  if(p[0]==="t"&&T[p[1]]){p[2]==="mcq"||p[2]==="def"?quiz(p[1],p[2]):pick(p[1])}else if(p[0]==="admin")admin();else home();scrollTo(0,0)}
addEventListener("hashchange",route);route();
</script></body></html>
